services:
  backend:
    build: ./backend
    container_name: paperflow-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-it}
    volumes:
      - paperflow_uploads:/app/uploads
      - paperflow_static:/app/static/audio
      - paperflow_db:/app
    restart: always

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: paperflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  paperflow_uploads:
  paperflow_static:
  paperflow_db:
